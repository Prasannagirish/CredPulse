[project]
name = "creditpulse"
version = "0.1.0"
description = "Agentic MLOps control plane for credit risk models (backtest on historical data)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyarrow>=16.0",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "torch>=2.3",
    "shap>=0.45",
    "numba>=0.59",
    "llvmlite>=0.42",
    "mlflow>=2.14",
    "mcp>=1.0",
    "pydantic>=2.7",
    "matplotlib>=3.9",
    "optuna>=3.6",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["*.py", "data/**", "model/**"]
